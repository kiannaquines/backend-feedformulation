<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Feed Formulation - Feed Formulation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'farm-green': '#2d5f3f',
                        'farm-light': '#84a98c',
                        'farm-accent': '#52796f',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation Header -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="dashboard.html" class="flex items-center">
                        <div class="bg-farm-green text-white rounded-lg p-2 mr-3">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"></path>
                            </svg>
                        </div>
                        <span class="text-xl font-bold text-gray-900">Feed Formulation</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="dashboard.html" class="text-gray-600 hover:text-farm-green transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="bg-gradient-to-r from-farm-green to-farm-accent rounded-2xl shadow-xl p-8 mb-8 text-white">
            <h1 class="text-4xl font-bold mb-2">Create Feed Formulation</h1>
            <p class="text-green-100 text-lg">Design an optimal feed mix for your livestock</p>
        </div>

        <!-- Alert Message -->
        <div id="alertMessage" class="hidden rounded-lg p-4 mb-6"></div>

        <!-- Main Form Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Input Form -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Step 1: Nutrient Requirements -->
                <div class="bg-white rounded-xl shadow-md p-6">
                    <div class="flex items-center mb-6">
                        <div class="bg-farm-green text-white rounded-full w-10 h-10 flex items-center justify-center font-bold mr-4">
                            1
                        </div>
                        <h2 class="text-2xl font-bold text-gray-900">Nutrient Requirements</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Protein (%)</label>
                            <input 
                                type="number" 
                                id="proteinRequirement"
                                step="0.1"
                                min="0"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                                placeholder="e.g., 18.0"
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Energy ME (Mcal/kg)</label>
                            <input 
                                type="number" 
                                id="energyRequirement"
                                step="0.1"
                                min="0"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                                placeholder="e.g., 3.0"
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Calcium (%)</label>
                            <input 
                                type="number" 
                                id="calciumRequirement"
                                step="0.01"
                                min="0"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                                placeholder="e.g., 0.9"
                            >
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Phosphorus (%)</label>
                            <input 
                                type="number" 
                                id="phosphorusRequirement"
                                step="0.01"
                                min="0"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                                placeholder="e.g., 0.45"
                            >
                        </div>
                    </div>
                </div>

                <!-- Step 2: Select Ingredients -->
                <div class="bg-white rounded-xl shadow-md p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center">
                            <div class="bg-farm-green text-white rounded-full w-10 h-10 flex items-center justify-center font-bold mr-4">
                                2
                            </div>
                            <h2 class="text-2xl font-bold text-gray-900">Select Ingredients</h2>
                        </div>
                        <button 
                            id="addIngredientBtn"
                            class="bg-farm-green text-white px-4 py-2 rounded-lg hover:bg-farm-accent transition-colors font-medium"
                        >
                            + Add Ingredient
                        </button>
                    </div>

                    <div id="ingredientsList" class="space-y-4">
                        <!-- Ingredients will be added here dynamically -->
                    </div>
                </div>

                <!-- Optimization Settings -->
                <div class="bg-white rounded-xl shadow-md p-6">
                    <h3 class="text-lg font-bold text-gray-900 mb-4">Optimization Settings</h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Optimization Method</label>
                        <select 
                            id="optimizationMethod"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                        >
                            <option value="highs">HiGHS (Recommended)</option>
                            <option value="revised simplex">Revised Simplex</option>
                            <option value="interior-point">Interior Point</option>
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex space-x-4">
                    <button 
                        id="calculateBtn"
                        class="flex-1 bg-farm-green text-white py-4 px-6 rounded-xl font-bold text-lg hover:bg-farm-accent transition-colors shadow-lg hover:shadow-xl"
                    >
                        Calculate Optimal Formulation
                    </button>
                    <button 
                        id="resetBtn"
                        class="bg-gray-200 text-gray-700 py-4 px-6 rounded-xl font-bold hover:bg-gray-300 transition-colors"
                    >
                        Reset
                    </button>
                </div>
            </div>

            <!-- Right Column: Results Panel -->
            <div class="lg:col-span-1">
                <div id="resultsPanel" class="bg-white rounded-xl shadow-md p-6 sticky top-24">
                    <h3 class="text-xl font-bold text-gray-900 mb-4">Results</h3>
                    <div id="resultsContent" class="text-center text-gray-500 py-12">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <p>Fill in the requirements and select ingredients to calculate the optimal formulation</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Ingredient Modal -->
    <div id="ingredientModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4">
                <h3 class="text-2xl font-bold text-gray-900">Add Ingredient</h3>
            </div>
            
            <form id="ingredientForm" class="p-6 space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Ingredient Name *</label>
                        <input 
                            type="text" 
                            id="ingredientName"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., Corn"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Cost per kg *</label>
                        <input 
                            type="number" 
                            id="ingredientCost"
                            step="0.01"
                            min="0"
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., 0.25"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Protein (%)</label>
                        <input 
                            type="number" 
                            id="ingredientProtein"
                            step="0.1"
                            min="0"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., 8.0"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Energy ME</label>
                        <input 
                            type="number" 
                            id="ingredientEnergy"
                            step="0.1"
                            min="0"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., 3.3"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Calcium (%)</label>
                        <input 
                            type="number" 
                            id="ingredientCalcium"
                            step="0.01"
                            min="0"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., 0.03"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Phosphorus (%)</label>
                        <input 
                            type="number" 
                            id="ingredientPhosphorus"
                            step="0.01"
                            min="0"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., 0.25"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Min % in Mix</label>
                        <input 
                            type="number" 
                            id="ingredientMin"
                            step="0.01"
                            min="0"
                            max="1"
                            value="0"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., 0.1"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Max % in Mix</label>
                        <input 
                            type="number" 
                            id="ingredientMax"
                            step="0.01"
                            min="0"
                            max="1"
                            value="1"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                            placeholder="e.g., 0.6"
                        >
                    </div>
                </div>

                <div class="flex space-x-3 pt-4">
                    <button 
                        type="button" 
                        id="cancelIngredient"
                        class="flex-1 bg-gray-200 text-gray-700 py-3 px-4 rounded-lg font-semibold hover:bg-gray-300 transition-colors"
                    >
                        Cancel
                    </button>
                    <button 
                        type="submit"
                        class="flex-1 bg-farm-green text-white py-3 px-4 rounded-lg font-semibold hover:bg-farm-accent transition-colors"
                    >
                        Add Ingredient
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Save Formulation Modal -->
    <div id="saveModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
            <h3 class="text-2xl font-bold text-gray-900 mb-4">Save Formulation</h3>
            
            <form id="saveForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Formulation Name *</label>
                    <input 
                        type="text" 
                        id="formulationName"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                        placeholder="e.g., Booster Chicken Feed"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                    <textarea 
                        id="formulationDescription"
                        rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-farm-green focus:border-transparent"
                        placeholder="Add notes about this formulation..."
                    ></textarea>
                </div>

                <div class="flex space-x-3 pt-4">
                    <button 
                        type="button" 
                        id="cancelSave"
                        class="flex-1 bg-gray-200 text-gray-700 py-3 px-4 rounded-lg font-semibold hover:bg-gray-300 transition-colors"
                    >
                        Cancel
                    </button>
                    <button 
                        type="submit"
                        class="flex-1 bg-farm-green text-white py-3 px-4 rounded-lg font-semibold hover:bg-farm-accent transition-colors"
                    >
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/formulation.js"></script>
</body>
</html>
