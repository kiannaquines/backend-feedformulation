  <rect width="100" height="100" fill="#2d5f3f" rx="15"/>
  
  <!-- Feed icon -->
  <g transform="translate(20, 20)">
    <!-- Grain/wheat symbol -->
    <circle cx="30" cy="20" r="4" fill="#ffffff"/>
    <circle cx="30" cy="32" r="4" fill="#ffffff"/>
    <circle cx="30" cy="44" r="4" fill="#ffffff"/>
    
    <circle cx="40" cy="26" r="4" fill="#84a98c"/>
    <circle cx="40" cy="38" r="4" fill="#84a98c"/>
    
    <circle cx="20" cy="26" r="4" fill="#84a98c"/>
